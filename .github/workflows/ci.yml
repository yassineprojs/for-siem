name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Lint import
        run: python -c "import requests, yaml, pydantic, tenacity, colorlog; print('deps ok')"
      - name: Unit smoke
        run: |
          python - <<'PY'
          from ey_cs_monitor.config_schema import AppConfig
          AppConfig()
          print('config ok')
          PY
      - name: Docker build
        run: docker build -t ey-cs-monitor .
